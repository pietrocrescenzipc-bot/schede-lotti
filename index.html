<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controllo Lotti - Pizzeria</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            margin: 0;
            padding: 15px;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #d9534f;
            font-size: 24px;
            margin-bottom: 20px;
        }
        /* Pannello di inserimento grande e intuitivo */
        .card-form {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }
        .card-form h2 {
            margin-top: 0;
            font-size: 18px;
            color: #0275d8;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 16px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            border: 2px solid #ccc;
            border-radius: 8px;
            background: #fff;
        }
        input:focus, select:focus {
            border-color: #0275d8;
            outline: none;
        }
        /* Pulsante enorme a prova di errore */
        .btn-big {
            width: 100%;
            background-color: #5cb85c;
            color: white;
            border: none;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
        }
        .btn-big:active {
            background-color: #4cae4c;
            transform: scale(0.98);
        }
        /* Lista lotti */
        .lotti-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }
        @media(min-width: 768px) {
            .lotti-container {
                grid-template-columns: 1fr 1fr;
            }
        }
        .lotto-card {
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
            border-left: 8px solid #5cb85c;
            position: relative;
        }
        .lotto-card.scadenza-vicina {
            border-left-color: #f0ad4e;
            background-color: #fcf8e3;
        }
        .lotto-card.scaduto {
            border-left-color: #d9534f;
            background-color: #f2dede;
        }
        .lotto-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .lotto-info {
            font-size: 15px;
            margin: 3px 0;
            color: #555;
        }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            color: #fff;
            background: #777;
            margin-bottom: 8px;
        }
        .btn-delete {
            background: #d9534f;
            color: white;
            border: none;
            padding: 8px 12px;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
            float: right;
            margin-top: -35px;
        }
    </style>
</head>
<body>

    <h1>🍕 Monitor Lotti Cucina & Pizzeria</h1>

    <!-- FORM DI INSERIMENTO -->
    <div class="card-form">
        <h2>➕ Registra Nuovo Lotto / Preparazione</h2>
        <form id="lottoForm" onsubmit="aggiungiLotto(event)">
            <div class="form-group">
                <label for="prodotto">Nome Prodotto o Preparazione:</label>
                <select id="prodotto" required>
                    <option value="" disabled selected>-- Seleziona cosa hai preparato/aperto --</option>
                    <option value="Impasto Classico">Impasto Classico</option>
                    <option value="Impasto Integrale">Impasto Integrale</option>
                    <option value="Mozzarella / Fiordilatte">Mozzarella / Fiordilatte</option>
                    <option value="Salsa di Pomodoro">Salsa di Pomodoro</option>
                    <option value="Verdure Grigliate">Verdure Grigliate</option>
                    <option value="Farina (Sacco nuovo)">Farina (Sacco nuovo)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="numLotto">Numero Lotto (o Lettera Fornitore):</label>
                <input type="text" id="numLotto" placeholder="Es. L-2026-03 o da bolla" required>
            </div>

            <div class="form-group">
                <label for="scadenza">Data e Ora di Scadenza:</label>
                <input type="datetime-local" id="scadenza" required>
            </div>

            <button type="submit" class="btn-big">REGISTRA LOTTO</button>
        </form>
    </div>

    <!-- LISTA DEI LOTTI ATTIVI -->
    <h2>📋 Lotti Attivi in Cucina</h2>
    <div id="listaLotti" class="lotti-container">
        <!-- I lotti inseriti appariranno qui dinamicamente -->
    </div>

    <script>
        // Array di esempio iniziale per non lasciare la schermata vuota
        let lotti = [
            { id: 1, prodotto: "Salsa di Pomodoro", lotto: "LOTTO-889", scadenza: "2026-03-10T12:00" },
            { id: 2, prodotto: "Impasto Classico", lotto: "IMPACT-01", scadenza: "2026-03-02T22:00" }
        ];

        function renderLotti() {
            const container = document.getElementById('listaLotti');
            container.innerHTML = '';

            if (lotti.length === 0) {
                container.innerHTML = '<p style="color: #777;">Nessun lotto registrato al momento.</p>';
                return;
            }

            const oraCorrente = new Date();

            lotti.forEach((item, index) => {
                const dataScad = new Date(item.scadenza);
                const diffOre = (dataScad - oraCorrente) / (1000 * 60 * 60);

                let statoClasse = '';
                let statoTesto = '✅ Valido';

                if (diffOre < 0) {
                    statoClasse = 'scaduto';
                    statoTesto = '❌ SCADUTO / DA BUTTARE';
                } else if (diffOre < 12) {
                    statoClasse = 'scadenza-vicina';
                    statoTesto = '⚠️ In Scadenza a breve';
                }

                // Formattazione data visiva
                const dataFormattata = dataScad.toLocaleString('it-IT', { dateStyle: 'short', timeStyle: 'short' });

                const card = document.createElement('div');
                card.className = `lotto-card ${statoClasse}`;
                card.innerHTML = `
                    <div class="badge">${statoTesto}</div>
                    <div class="lotto-title">${item.prodotto}</div>
                    <div class="lotto-info"><strong>Lotto:</strong> ${item.lotto}</div>
                    <div class="lotto-info"><strong>Scadenza:</strong> ${dataFormattata}</div>
                    <button class="btn-delete" onclick="eliminaLotto(${index})">Elimina / Consumato</button>
                `;
                container.appendChild(card);
            });
        }

        function aggiungiLotto(event) {
            event.preventDefault();
            const prodotto = document.getElementById('prodotto').value;
            const numLotto = document.getElementById('numLotto').value;
            const scadenza = document.getElementById('scadenza').value;

            lotti.unshift({ id: Date.now(), prodotto, lotto: numLotto, scadenza });

            // Reset form
            document.getElementById('lottoForm').reset();
            renderLotti();
        }

        function eliminaLotto(index) {
            if(confirm("Confermi di aver consumato o eliminato questo lotto?")) {
                lotti.splice(index, 1);
                renderLotti();
            }
        }

        // Carica la lista all'avvio
        renderLotti();
    </script>
</body>
</html>
