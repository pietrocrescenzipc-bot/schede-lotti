<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracciabilità HACCP Pizzeria con OCR</title>
    <!-- Libreria OCR per leggere le foto delle etichette -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            margin: 0;
            padding: 15px;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #d9534f;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #e2e8f0;
            color: #4a5568;
        }
        .tab-btn.active {
            background: #0275d8;
            color: white;
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
        }
        .section-panel {
            display: none;
        }
        .section-panel.active {
            display: block;
        }
        .card-form {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }
        .card-form h2 {
            margin-top: 0;
            font-size: 18px;
            color: #0275d8;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 16px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            border: 2px solid #ccc;
            border-radius: 8px;
            background: #fff;
        }
        input:focus, select:focus {
            border-color: #0275d8;
            outline: none;
        }
        /* Pulsanti dedicati */
        .btn-big {
            width: 100%;
            background-color: #5cb85c;
            color: white;
            border: none;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
        }
        .btn-camera {
            width: 100%;
            background-color: #f0ad4e;
            color: white;
            border: none;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 15px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
        }
        .btn-secondary {
            background-color: #f0ad4e;
            color: white;
            padding: 10px 15px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
        }
        /* Stato caricamento foto */
        #loadingOCR {
            display: none;
            background: #e2e8f0;
            padding: 10px;
            text-align: center;
            font-weight: bold;
            border-radius: 6px;
            margin-bottom: 15px;
            color: #0275d8;
        }
        .ingrediente-row {
            background: #fdfdfd;
            border: 1px solid #ddd;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr auto;
            gap: 10px;
            align-items: end;
        }
        @media(max-width: 768px) {
            .ingrediente-row {
                grid-template-columns: 1fr;
            }
        }
        .btn-remove-ing {
            background: #d9534f;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .lotti-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }
        @media(min-width: 768px) {
            .lotti-container {
                grid-template-columns: 1fr 1fr;
            }
        }
        .lotto-card {
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
            border-left: 8px solid #5cb85c;
            position: relative;
        }
        .lotto-card.scadenza-vicina {
            border-left-color: #f0ad4e;
            background-color: #fcf8e3;
        }
        .lotto-card.scaduto {
            border-left-color: #d9534f;
            background-color: #f2dede;
        }
        .lotto-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .lotto-info {
            font-size: 15px;
            margin: 3px 0;
            color: #555;
        }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            color: #fff;
            background: #777;
            margin-bottom: 8px;
        }
        .btn-delete {
            background: #d9534f;
            color: white;
            border: none;
            padding: 8px 12px;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
            float: right;
            margin-top: -35px;
        }
        .ingredienti-box {
            margin-top: 10px;
            background: #f8f9fa;
            padding: 8px;
            border-radius: 6px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <h1>🍕 Sistema Tracciabilità Cucina + OCR</h1>

    <div class="tabs">
        <button class="tab-btn active" onclick="cambiaTab('prodotti')">📦 Prodotti / Materie Prime</button>
        <button class="tab-btn" onclick="cambiaTab('preparazioni')">🥣 Preparazioni (Impasti)</button>
    </div>

    <!-- SEZIONE PRODOTTI -->
    <div id="panel-prodotti" class="section-panel active">
        <div class="card-form">
            <h2>➕ Registra Arrivo Prodotto</h2>
            
            <!-- PULSANTE FOTOCAMERA / SCANSIONE -->
            <button type="button" class="btn-camera" onclick="document.getElementById('fileEtichetta').click()">
                📸 FOTOGRAFA ETICHETTA (Compila Automaticamente)
            </button>
            <input type="file" id="fileEtichetta" accept="image/*" capture="environment" style="display:none;" onchange="scansionaEtichetta(event)">
            
            <div id="loadingOCR">⏳ Lettura etichetta in corso... Attendere qualche secondo.</div>

            <form id="prodottoForm" onsubmit="aggiungiProdotto(event)">
                <div class="form-group">
                    <label for="nomeProdotto">Nome Prodotto:</label>
                    <input type="text" id="nomeProdotto" placeholder="Es. Farina tipo 00, Mozzarella..." required>
                </div>
                <div class="form-group">
                    <label for="fornitoreProdotto">Fornitore:</label>
                    <input type="text" id="fornitoreProdotto" placeholder="Es. Molino Rossi" required>
                </div>
                <div class="form-group">
                    <label for="lottoProdotto">Numero Lotto:</label>
                    <input type="text" id="lottoProdotto" placeholder="Rilevato da foto o digitato" required>
                </div>
                <div class="form-group">
                    <label for="scadenzaProdotto">Data di Scadenza:</label>
                    <input type="datetime-local" id="scadenzaProdotto" required>
                </div>
                <button type="submit" class="btn-big">REGISTRA PRODOTTO</button>
            </form>
        </div>

        <h2>📋 Prodotti / Scorte Attive</h2>
        <div id="listaProdotti" class="lotti-container"></div>
    </div>

    <!-- SEZIONE PREPARAZIONI -->
    <div id="panel-preparazioni" class="section-panel">
        <div class="card-form">
            <h2>➕ Crea Nuova Preparazione</h2>
            <form id="preparazioneForm" onsubmit="aggiungiPreparazione(event)">
                <div class="form-group">
                    <label for="nomePreparazione">Nome Preparazione:</label>
                    <input type="text" id="nomePreparazione" placeholder="Es. Impasto Pizza Classico" required>
                </div>
                <div class="form-group">
                    <label for="dataPrep">Data e Ora Preparazione:</label>
                    <input type="datetime-local" id="dataPrep" required>
                </div>
                <div class="form-group">
                    <label for="scadenzaPrep">Data e Ora di Scadenza Fine:</label>
                    <input type="datetime-local" id="scadenzaPrep" required>
                </div>

                <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ddd;">
                
                <label>Ingredienti Utilizzati e Lotti:</label>
                <div id="containerIngredienti"></div>
                <button type="button" class="btn-secondary" onclick="aggiungiRigaIngrediente()">+ Aggiungi Ingrediente</button>
                
                <br><br>
                <button type="submit" class="btn-big">REGISTRA PREPARAZIONE</button>
            </form>
        </div>

        <h2>📋 Preparazioni Attive</h2>
        <div id="listaPreparazioni" class="lotti-container"></div>
    </div>

    <script>
        let prodotti = [
            { id: 1, nome: "Farina Tipo 00", fornitore: "Molino Spadoni", lotto: "F-554", scadenza: "2026-12-31T23:59" }
        ];

        let preparazioni = [];

        function cambiaTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.section-panel').forEach(p => p.classList.remove('active'));

            if(tab === 'prodotti') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('panel-prodotti').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('panel-preparazioni').classList.add('active');
            }
        }

        // --- FUNZIONE INTELLIGENTE DI SCANSIONE FOTO (OCR) ---
        function scansionaEtichetta(event) {
            const file = event.target.files[0];
            if (!file) return;

            const loadingDiv = document.getElementById('loadingOCR');
            loadingDiv.style.display = 'block';

            // Utilizzo di Tesseract per analizzare l'immagine direttamente nel browser
            Tesseract.recognize(
                file,
                'ita+eng', // Riconosce italiano e inglese
                { logger: m => console.log(m) }
            ).then(({ data: { text } }) => {
                loadingDiv.style.display = 'none';
                console.log("Testo estratto:", text);

                // Tentativo di estrazione intelligente del lotto
                // Cerca parole come "Lotto", "L.", "LOT" seguite da lettere/numeri
                const matchLotto = text.match(/(?:lotto|l\.|lot)[:\s]*([a-zA-Z0-9\-_/]+)/i);
                if (matchLotto && matchLotto[1]) {
                    document.getElementById('lottoProdotto').value = matchLotto[1].trim();
                }

                alert("Scansione completata! Controlla se il lotto è corretto e compila il resto se necessario.");
            }).catch(err => {
                loadingDiv.style.display = 'none';
                alert("Errore nella lettura dell'immagine. Riprova con una foto più nitida.");
                console.error(err);
            });
        }

        // --- FUNZIONI PRODOTTI ---
        function renderProdotti() {
            const container = document.getElementById('listaProdotti');
            container.innerHTML = '';
            if (prodotti.length === 0) {
                container.innerHTML = '<p style="color: #777;">Nessun prodotto registrato.</p>';
                return;
            }

            const ora = new Date();
            prodotti.forEach((item, index) => {
                const dataScad = new Date(item.scadenza);
                const diffOre = (dataScad - ora) / (1000 * 60 * 60);
                let statoClasse = '';
                let statoTesto = '✅ Valido';

                if (diffOre < 0) { statoClasse = 'scaduto'; statoTesto = '❌ SCADUTO'; }
                else if (diffOre < 24) { statoClasse = 'scadenza-vicina'; statoTesto = '⚠️ In Scadenza'; }

                const card = document.createElement('div');
                card.className = `lotto-card ${statoClasse}`;
                card.innerHTML = `
                    <div class="badge">${statoTesto}</div>
                    <div class="lotto-title">${item.nome}</div>
                    <div class="lotto-info"><strong>Fornitore:</strong> ${item.fornitore}</div>
                    <div class="lotto-info"><strong>Lotto:</strong> ${item.lotto}</div>
                    <div class="lotto-info"><strong>Scadenza:</strong> ${dataScad.toLocaleString('it-IT')}</div>
                    <button class="btn-delete" onclick="eliminaProdotto(${index})">Elimina</button>
                `;
                container.appendChild(card);
            });
        }

        function aggiungiProdotto(e) {
            e.preventDefault();
            const nome = document.getElementById('nomeProdotto').value;
            const fornitore = document.getElementById('fornitoreProdotto').value;
            const lotto = document.getElementById('lottoProdotto').value;
            const scadenza = document.getElementById('scadenzaProdotto').value;

            prodotti.unshift({ id: Date.now(), nome, fornitore, lotto, scadenza });
            document.getElementById('prodottoForm').reset();
            renderProdotti();
        }

        function eliminaProdotto(index) {
            if(confirm("Eliminare questo prodotto?")) {
                prodotti.splice(index, 1);
                renderProdotti();
            }
        }

        // --- FUNZIONI PREPARAZIONI ---
        function aggiungiRigaIngrediente(nomeVal = "", lottoVal = "", scadVal = "", fornVal = "") {
            const container = document.getElementById('containerIngredienti');
            const row = document.createElement('div');
            row.className = 'ingrediente-row';
            row.innerHTML = `
                <div>
                    <label style="font-size:13px;">Ingrediente:</label>
                    <input type="text" class="ing-nome" value="${nomeVal}" required>
                </div>
                <div>
                    <label style="font-size:13px;">N. Lotto:</label>
                    <input type="text" class="ing-lotto" value="${lottoVal}" required>
                </div>
                <div>
                    <label style="font-size:13px;">Scadenza:</label>
                    <input type="text" class="ing-scad" value="${scadVal}" required>
                </div>
                <div>
                    <label style="font-size:13px;">Fornitore:</label>
                    <input type="text" class="ing-forn" value="${fornVal}" required>
                </div>
                <div>
                    <button type="button" class="btn-remove-ing" onclick="this.parentElement.parentElement.remove()">X</button>
                </div>
            `;
            container.appendChild(row);
        }

        function renderPreparazioni() {
            const container = document.getElementById('listaPreparazioni');
            container.innerHTML = '';
            if (preparazioni.length === 0) {
                container.innerHTML = '<p style="color: #777;">Nessuna preparazione registrata.</p>';
                return;
            }

            const ora = new Date();
            preparazioni.forEach((item, index) => {
                const dataScad = new Date(item.scadenza);
                const diffOre = (dataScad - ora) / (1000 * 60 * 60);
                let statoClasse = '';
                let statoTesto = '✅ Valido';

                if (diffOre < 0) { statoClasse = 'scaduto'; statoTesto = '❌ SCADUTO'; }
                else if (diffOre < 6) { statoClasse = 'scadenza-vicina'; statoTesto = '⚠️ In Scadenza'; }

                let htmlIngredienti = '<div class="ingredienti-box"><strong>Ingredienti usati:</strong><ul>';
                item.ingredienti.forEach(ing => {
                    htmlIngredienti += `<li>${ing.nome} - Lotto: <strong>${ing.lotto}</strong></li>`;
                });
                htmlIngredienti += '</ul></div>';

                const card = document.createElement('div');
                card.className = `lotto-card ${statoClasse}`;
                card.innerHTML = `
                    <div class="badge">${statoTesto}</div>
                    <div class="lotto-title">${item.nome}</div>
                    <div class="lotto-info"><strong>Preparazione:</strong> ${new Date(item.dataPrep).toLocaleString('it-IT')}</div>
                    ${htmlIngredienti}
                    <button class="btn-delete" onclick="eliminaPreparazione(${index})">Elimina</button>
                `;
                container.appendChild(card);
            });
        }

        function aggiungiPreparazione(e) {
            e.preventDefault();
            const nomePreparazione = document.getElementById('nomePreparazione').value;
            const dataPrep = document.getElementById('dataPrep').value;
            const scadenzaPrep = document.getElementById('scadenzaPrep').value;

            const righeIng = document.querySelectorAll('.ingrediente-row');
            if(righeIng.length === 0) {
                alert("Inserisci almeno un ingrediente!");
                return;
            }

            let ingredientiList = [];
            righeIng.forEach(riga => {
                ingredientiList.push({
                    nome: riga.querySelector('.ing-nome').value,
                    lotto: riga.querySelector('.ing-lotto').value,
                    scad: riga.querySelector('.ing-scad').value,
                    fornitore: riga.querySelector('.ing-forn').value
                });
            });

            preparazioni.unshift({
                id: Date.now(),
                nome: nomePreparazione,
                dataPrep: dataPrep,
                scadenza: scadenzaPrep,
                ingredienti: ingredientiList
            });

            document.getElementById('preparazioneForm').reset();
            document.getElementById('containerIngredienti').innerHTML = '';
            renderPreparazioni();
        }

        function eliminaPreparazione(index) {
            if(confirm("Eliminare questa preparazione?")) {
                preparazioni.splice(index, 1);
                renderPreparazioni();
            }
        }

        renderProdotti();
        renderPreparazioni();
        aggiungiRigaIngrediente("Farina 00", "F-554", "31/12/2026", "Molino Spadoni");
    </script>
</body>
</html>
