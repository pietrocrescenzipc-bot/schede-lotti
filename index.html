<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Lotti Pizzeria Semplice</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 p-4 max-w-2xl mx-auto">

    <div class="bg-white rounded-2xl shadow-md p-6 space-y-6">
        <h1 class="text-xl font-bold text-red-700 flex items-center gap-2">
            <i class="fa-solid fa-pizza-slice"></i> Registro Lotti Pizzeria
        </h1>

        <!-- Selezione Preparazione -->
        <div>
            <label class="block font-bold text-sm mb-1">Seleziona Preparazione:</label>
            <select id="preparazione" class="w-full border p-3 rounded-xl font-bold text-lg bg-gray-50">
                <option value="Impasto Pizza">Impasto Pizza</option>
                <option value="Impasto Pinsa">Impasto Pinsa</option>
                <option value="Salsa Pomodoro">Salsa Pomodoro</option>
            </select>
        </div>

        <!-- Data -->
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Data Preparazione:</label>
                <input type="date" id="data-prep" class="w-full border p-2.5 rounded-xl">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Lotto Interno / Note:</label>
                <input type="text" id="lotto-interno" placeholder="Es. Turno Mattina" class="w-full border p-2.5 rounded-xl">
            </div>
        </div>

        <hr>

        <!-- Sezione Ingredienti con Fotocamera Nativa -->
        <div class="space-y-4">
            <h2 class="font-bold text-gray-700">Ingredienti e Lotti</h2>
            
            <!-- Ingrediente 1 -->
            <div class="bg-gray-50 p-4 rounded-xl border space-y-3">
                <div class="flex justify-between items-center">
                    <span class="font-bold text-red-600">FARINA</span>
                    <!-- Pulsante Fotocamera Nativo Puro -->
                    <label class="bg-red-600 text-white px-4 py-2 rounded-xl text-sm font-bold cursor-pointer shadow flex items-center gap-2">
                        <i class="fa-solid fa-camera"></i> Scatta Etichetta
                        <input type="file" accept="image/*" capture="environment" class="hidden" onchange="riempiDati(this, 'lotto-1', 'forn-1')">
                    </label>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                    <input type="text" id="lotto-1" placeholder="Lotto ingrediente" class="border p-2 rounded-lg bg-white text-sm">
                    <input type="text" id="forn-1" placeholder="Fornitore / Scadenza" class="border p-2 rounded-lg bg-white text-sm">
                </div>
            </div>

            <!-- Ingrediente 2 -->
            <div class="bg-gray-50 p-4 rounded-xl border space-y-3">
                <div class="flex justify-between items-center">
                    <span class="font-bold text-red-600">LIEVITO</span>
                    <label class="bg-red-600 text-white px-4 py-2 rounded-xl text-sm font-bold cursor-pointer shadow flex items-center gap-2">
                        <i class="fa-solid fa-camera"></i> Scatta Etichetta
                        <input type="file" accept="image/*" capture="environment" class="hidden" onchange="riempiDati(this, 'lotto-2', 'forn-2')">
                    </label>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                    <input type="text" id="lotto-2" placeholder="Lotto ingrediente" class="border p-2 rounded-lg bg-white text-sm">
                    <input type="text" id="forn-2" placeholder="Fornitore / Scadenza" class="border p-2 rounded-lg bg-white text-sm">
                </div>
            </div>
        </div>

        <!-- Bottoni finali -->
        <div class="flex gap-4 pt-4">
            <button onclick="window.print()" class="flex-1 bg-gray-800 text-white py-3 rounded-xl font-bold shadow">
                <i class="fa-solid fa-print mr-2"></i> Stampa Scheda
            </button>
            <button onclick="alert('Scheda salvata correttamente!')" class="flex-1 bg-emerald-600 text-white py-3 rounded-xl font-bold shadow">
                <i class="fa-solid fa-check mr-2"></i> Salva
            </button>
        </div>
    </div>

    <script>
        // Imposta la data odierna in automatico
        document.getElementById('data-prep').valueAsDate = new Date();

        // Funzione super semplice di simulazione compilazione da foto
        function riportaDati(inputLotto, inputForn) {
            document.getElementById(inputLotto).value = "L" + Math.floor(Math.random() * 90000 + 10000);
            document.getElementById(inputForn).value = "2027-03-15 (Fornitore SRL)";
        }

        function riempiDati(fileInput, lottoId, fornId) {
            if (fileInput.files && fileInput.files[0]) {
                // Mostra un piccolo avviso visivo che la foto è stata acquisita
                riportaDati(lottoId, fornId);
                alert("Foto acquisita e dati compilati con successo!");
            }
        }
    </script>
</body>
</html>
